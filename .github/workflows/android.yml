name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'icon.svg', 'manifest.webmanifest', 'android-app/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: APK bauen
        run: ./gradlew assembleDebug
        working-directory: android-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: tagebuch-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
