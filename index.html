<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tagebuch</title>
<style>
  :root { --bg:#fff; --fg:#000; --muted:#777; --line:#000; --soft:#eee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#fff; --muted:#999; --line:#fff; --soft:#1a1a1a; }
  }
  * { box-sizing:border-box; border-radius:0; }
  html, body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  body { position:fixed; inset:0; background:var(--bg); color:var(--fg); font:15px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace; }
  .app { display:flex; height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  aside { width:280px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column;
          overflow:hidden; transition:margin-left .2s; }
  .app.closed aside { margin-left:-281px; }
  aside header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  #list { flex:1; overflow-y:auto; list-style:none; margin:0; padding:0; }
  #list li { padding:10px 14px; border-bottom:1px solid var(--soft); cursor:pointer; }
  #list li.active { background:var(--fg); color:var(--bg); }
  #list li b { display:block; font-weight:700; }
  #list li small { display:block; opacity:.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list li.empty { cursor:default; opacity:.6; }
  aside footer { padding:10px 14px; border-top:1px solid var(--line); }

  main { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .bar .title { flex:1; min-width:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .nlabel { padding:6px 14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  #scroll { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
  #text { min-height:calc(var(--ch, 400px) * .76); }
  #notes { min-height:calc(var(--ch, 400px) * .24 - 32px); }
  textarea { display:block; width:100%; border:0; overflow:hidden; outline:0; resize:none; padding:18px 20px; background:var(--bg);
             color:var(--fg); font:inherit; }
  .foot { display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid var(--line); }
  #status { flex:1; min-width:0; color:var(--muted); font-size:12px; line-height:1.3; }
  .foot button { white-space:nowrap; }

  button { font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:6px 12px; cursor:pointer; }
  button:hover, button:active { background:var(--fg); color:var(--bg); }
  .full { width:100%; }
  button.icon { display:inline-flex; align-items:center; justify-content:center; width:34px; height:30px; padding:0; }
  aside footer .full + .full { margin-top:8px; }
  #err { position:fixed; left:0; right:0; top:0; z-index:9; background:#fff; color:#000; border-bottom:2px solid #000; padding:8px 12px; font-size:12px; white-space:pre-wrap; }

  @media (max-width:700px) {
    body { font-size:14px; }
    .bar { padding:8px 12px; }
    .foot { padding:8px 12px; }
    #status { display:none; }
    .foot button { flex:1; padding:10px 8px; }
    textarea { padding:14px; font-size:16px; line-height:1.7; }
    aside { position:fixed; inset:0; width:100%; z-index:2; background:var(--bg); margin-left:0; border-right:0;
            padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); transition:transform .2s; }
    .app.closed aside { margin-left:0; transform:translateX(-100%); }
  }
</style>
</head>
<body>
<div id="err" hidden></div>
<div class="app" id="app">
  <aside>
    <header><b>Tagebuch</b><button id="close" class="icon" title="Liste ausblenden"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" fill="none"/></svg></button></header>
    <ul id="list"></ul>
    <footer><button class="full" id="folder" hidden>📁 Speicherordner wählen</button><button class="full" id="all">Alle als .md exportieren</button></footer>
  </aside>
  <main>
    <div class="bar">
      <button id="toggle" class="icon" title="Liste ein-/ausblenden"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M0 1h16M0 6h16M0 11h16" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      <span class="title" id="date"></span>
    </div>
    <div id="scroll">
      <textarea id="text" placeholder="Wie war dein Tag?" autofocus></textarea>
      <div class="nlabel">Notizen &amp; Fragen</div>
      <textarea id="notes" placeholder="- Notiz oder Frage …"></textarea>
    </div>
    <div class="foot">
      <span id="status"></span>
      <button id="save">.md speichern</button>
    </div>
  </main>
</div>
<script>
function showError(m) { const e = document.getElementById('err'); e.hidden = false; e.textContent += m + '\n'; }
addEventListener('error', ev => showError((ev.message || 'Fehler') + ' (Zeile ' + ev.lineno + ')'));
addEventListener('unhandledrejection', ev => showError('Promise: ' + (ev.reason && ev.reason.message || ev.reason)));
const KEY = 'tagebuch-entries';
const $ = id => document.getElementById(id);
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const store = e => localStorage.setItem(KEY, JSON.stringify(e));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pretty = s => new Date(s + 'T12:00:00').toLocaleDateString('de-DE',
  { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const bullets = n => n.split('\n').map(l => l.trim()).filter(l => l && l !== '-')
  .map(l => '- ' + l.replace(/^[-•*]\s*/, '')).join('\n');
const toMd = (day, e) => {
  let md = `# ${pretty(day)}\n\n${e.t.trim()}\n`;
  const b = bullets(e.n);
  if (b) md += `\n## Notizen & Fragen\n\n${b}\n`;
  return md;
};
const isEmpty = e => !e.t.trim() && !bullets(e.n);
const mobile = () => matchMedia('(max-width:700px)').matches;

let entries = load();
// Migration: früher String, jetzt { t: Text, n: Notizen }
for (const d in entries) if (typeof entries[d] === 'string') entries[d] = { t: entries[d], n: '' };
const get = d => entries[d] || { t:'', n:'' };
let current = iso(new Date());

const setOpen = open => $('app').classList.toggle('closed', !open);
const isOpen = () => !$('app').classList.contains('closed');

function show(day) {
  current = day;
  $('date').textContent = pretty(day);
  $('text').value = get(day).t;
  $('notes').value = get(day).n;
  if (typeof autosize === 'function') { autosize(); $('scroll').scrollTop = 0; }
  $('status').textContent = '';
  renderList();
}

function renderList() {
  const ul = $('list'); ul.innerHTML = '';
  const days = new Set(Object.keys(entries));
  days.add(iso(new Date()));               // heutiger Tag ist immer in der Liste
  [...days].sort().reverse().forEach(day => {
    const li = document.createElement('li');
    if (day === current) li.className = 'active';
    li.innerHTML = '<b></b><small></small>';
    li.firstChild.textContent = pretty(day);
    li.lastChild.textContent = (get(day).t || get(day).n || 'Noch leer').replace(/\s+/g, ' ');
    li.onclick = () => { show(day); if (mobile()) setOpen(false); };
    ul.appendChild(li);
  });
}

function onInput() {
  const e = { t: $('text').value, n: $('notes').value };
  if (isEmpty(e)) delete entries[current]; else entries[current] = e;
  store(entries);
  $('status').textContent = 'Automatisch zwischengespeichert';
  renderList();
  queueWrite();
}
$('text').addEventListener('input', onInput);
$('notes').addEventListener('input', onInput);

// Notizen: jede Zeile bekommt automatisch einen Aufzählungspunkt
const notes = $('notes');
notes.addEventListener('focus', () => { if (!notes.value) { notes.value = '- '; } });
notes.addEventListener('blur', () => { if (notes.value.trim() === '-') { notes.value = ''; onInput(); } });
// beforeinput statt keydown: funktioniert auch mit Handy-Tastaturen
notes.addEventListener('beforeinput', ev => {
  if (ev.inputType !== 'insertLineBreak' && ev.inputType !== 'insertParagraph') return;
  ev.preventDefault();
  const v = notes.value, pos = notes.selectionStart;
  const start = v.lastIndexOf('\n', pos - 1) + 1;
  if (v.slice(start, pos).trim() === '-') {          // leere Zeile + Enter beendet die Liste
    notes.setRangeText('', start, pos, 'end');
  } else {
    notes.setRangeText('\n- ', pos, notes.selectionEnd, 'end');
  }
  onInput();
});

function download(name, content) {
  const url = URL.createObjectURL(new Blob([content], { type:'text/markdown;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href:url, download:name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Beide Felder wachsen mit dem Text; gescrollt wird der gesamte Bereich unter der oberen Leiste.
// Trennlinie liegt im unteren Drittel (Text ≈ 76 %, Notizen ≈ 24 % der sichtbaren Höhe).
function autosize() {
  $('scroll').style.setProperty('--ch', $('scroll').clientHeight + 'px');
  for (const ta of [$('text'), $('notes')]) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }
}
$('text').addEventListener('input', autosize);
$('notes').addEventListener('input', autosize);
addEventListener('resize', autosize);

setOpen(!mobile());
show(current);
autosize();

// --- Android-App: Ordner wählen und .md-Dateien direkt dort ablegen ---
const FS = (() => {
  try {
    const C = window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform())
      return C.registerPlugin ? C.registerPlugin('FolderStorage') : C.Plugins.FolderStorage;
  } catch (e) { showError('Plugin: ' + e); }
  return null;
})();
let folderName = null, writeTimer = null;

function flash(btn, text) {
  const old = btn.dataset.label || (btn.dataset.label = btn.textContent);
  btn.textContent = text;
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = btn.dataset.label; }, 1800);
}
function folderLabel() {
  $('folder').textContent = folderName ? `📁 Ordner: ${folderName}` : '📁 Speicherordner wählen';
}
async function writeDay(day) {
  const e = get(day);
  if (!folderName || isEmpty(e)) return;
  await FS.writeFile({ name: `${day}.md`, content: toMd(day, e) });
}
function queueWrite() {
  if (!FS || !folderName) return;
  clearTimeout(writeTimer);
  const day = current;
  writeTimer = setTimeout(() => writeDay(day).catch(err => {
    showError('Speichern fehlgeschlagen: ' + (err.message || err));
  }), 700);
}
async function pickFolder() {
  try {
    const r = await FS.pickFolder();
    folderName = r.name; folderLabel();
    return true;
  } catch (e) { return false; }   // abgebrochen
}
async function writeAll() {
  const days = Object.keys(entries);
  for (const d of days) await writeDay(d);
  return days.length;
}

if (FS) {
  // Android-App: alles automatisch – Speichern-Leiste und Export-Knopf werden nicht gebraucht
  $('folder').hidden = false;
  $('all').hidden = true;
  document.querySelector('.foot').style.display = 'none';
  FS.getFolder().then(r => {
    folderName = r.selected ? r.name : null; folderLabel();
    if (!folderName) setOpen(true);          // erster Start: Menü mit Ordner-Auswahl zeigen
  }).catch(e => showError('getFolder: ' + (e.message || e)));
  $('folder').onclick = async () => {
    if (await pickFolder()) { await writeAll(); setOpen(false); }
  };
  const flush = () => { if (writeTimer) { clearTimeout(writeTimer); writeTimer = null; writeDay(current).catch(() => {}); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  addEventListener('pagehide', flush);
}

$('save').onclick = async () => {
  const e = get(current);
  if (isEmpty(e)) return $('status').textContent = 'Nichts zu speichern.';
  if (FS) {
    if (!folderName && !(await pickFolder())) return;
    try { await writeDay(current); flash($('save'), 'Gespeichert ✓'); }
    catch (err) { $('status').textContent = 'Fehler: ' + (err.message || err); flash($('save'), 'Fehler'); }
    return;
  }
  download(`${current}.md`, toMd(current, e));
  $('status').textContent = `${current}.md gespeichert (Ordner „Downloads“)`;
};

$('all').onclick = async () => {
  if (FS) {
    if (!folderName && !(await pickFolder())) return;
    const n = await writeAll();
    $('status').textContent = `${n} Dateien in „${folderName}“ geschrieben`;
    return;
  }
  const days = Object.keys(entries).sort();
  if (days.length) download('tagebuch.md', days.map(d => toMd(d, get(d))).join('\n---\n\n'));
};

// Über Mitternacht offen gelassen: beim Zurückkehren automatisch zum neuen Tag wechseln
let lastToday = iso(new Date());
document.addEventListener('visibilitychange', () => {
  const now = iso(new Date());
  if (!document.hidden && now !== lastToday) {
    if (current === lastToday) show(now); else renderList();
    lastToday = now;
  }
});
$('toggle').onclick = () => setOpen(!isOpen());
$('close').onclick = () => setOpen(false);

if ('serviceWorker' in navigator && !FS) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
