<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tagebuch</title>
<style>
  :root { --bg:#fff; --fg:#000; --muted:#777; --line:#000; --soft:#eee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#fff; --muted:#999; --line:#fff; --soft:#1a1a1a; }
  }
  * { box-sizing:border-box; border-radius:0; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace; }
  .app { display:flex; height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  aside { width:280px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column;
          overflow:hidden; transition:margin-left .2s; }
  .app.closed aside { margin-left:-281px; }
  aside header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  #list { flex:1; overflow-y:auto; list-style:none; margin:0; padding:0; }
  #list li { padding:10px 14px; border-bottom:1px solid var(--soft); cursor:pointer; }
  #list li.active { background:var(--fg); color:var(--bg); }
  #list li b { display:block; font-weight:700; }
  #list li small { display:block; opacity:.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list li.empty { cursor:default; opacity:.6; }
  aside footer { padding:10px 14px; border-top:1px solid var(--line); }

  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .bar .title { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  textarea { flex:1; width:100%; border:0; outline:0; resize:none; padding:18px 20px; background:var(--bg);
             color:var(--fg); font:inherit; }
  #status { padding:6px 14px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; min-height:30px; }

  button { font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:6px 12px; cursor:pointer; }
  button:hover, button:active { background:var(--fg); color:var(--bg); }
  .full { width:100%; }

  @media (max-width:700px) {
    aside { position:fixed; inset:0; width:100%; z-index:2; background:var(--bg); margin-left:0; border-right:0;
            padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); transition:transform .2s; }
    .app.closed aside { margin-left:0; transform:translateX(-100%); }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <header><b>Tagebuch</b><button id="close" title="Liste ausblenden">⟨</button></header>
    <ul id="list"></ul>
    <footer><button class="full" id="all">Alle als .md exportieren</button></footer>
  </aside>
  <main>
    <div class="bar">
      <button id="toggle" title="Liste ein-/ausblenden">☰</button>
      <span class="title" id="date"></span>
      <button id="today" title="Heute">Heute</button>
      <button id="share">Teilen</button>
      <button id="save">.md speichern</button>
    </div>
    <textarea id="text" placeholder="Wie war dein Tag?" autofocus></textarea>
    <div id="status"></div>
  </main>
</div>
<script>
const KEY = 'tagebuch-entries';
const $ = id => document.getElementById(id);
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const store = e => localStorage.setItem(KEY, JSON.stringify(e));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pretty = s => new Date(s + 'T12:00:00').toLocaleDateString('de-DE',
  { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const toMd = (day, text) => `# ${pretty(day)}\n\n${text.trim()}\n`;
const mobile = () => matchMedia('(max-width:700px)').matches;

let entries = load();
let current = iso(new Date());

const setOpen = open => $('app').classList.toggle('closed', !open);
const isOpen = () => !$('app').classList.contains('closed');

function show(day) {
  current = day;
  $('date').textContent = pretty(day);
  $('text').value = entries[day] || '';
  $('status').textContent = '';
  renderList();
}

function renderList() {
  const ul = $('list'); ul.innerHTML = '';
  const days = new Set(Object.keys(entries));
  days.add(iso(new Date()));               // heutiger Tag ist immer in der Liste
  [...days].sort().reverse().forEach(day => {
    const li = document.createElement('li');
    if (day === current) li.className = 'active';
    li.innerHTML = '<b></b><small></small>';
    li.firstChild.textContent = pretty(day);
    li.lastChild.textContent = (entries[day] || 'Noch leer').replace(/\s+/g, ' ');
    li.onclick = () => { show(day); if (mobile()) setOpen(false); };
    ul.appendChild(li);
  });
}

$('text').addEventListener('input', () => {
  const t = $('text').value;
  if (t.trim()) entries[current] = t; else delete entries[current];
  store(entries);
  $('status').textContent = 'Automatisch zwischengespeichert';
  renderList();
});

function download(name, content) {
  const url = URL.createObjectURL(new Blob([content], { type:'text/markdown;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href:url, download:name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('save').onclick = () => {
  const t = $('text').value;
  if (!t.trim()) return $('status').textContent = 'Nichts zu speichern.';
  download(`${current}.md`, toMd(current, t));
  $('status').textContent = `${current}.md gespeichert (Ordner „Downloads“)`;
};

$('share').onclick = async () => {
  const t = $('text').value;
  if (!t.trim()) return $('status').textContent = 'Nichts zu teilen.';
  const file = new File([toMd(current, t)], `${current}.md`, { type:'text/markdown' });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) await navigator.share({ files:[file] });
    else download(file.name, toMd(current, t));
  } catch (e) { /* abgebrochen */ }
};

$('all').onclick = () => {
  const days = Object.keys(entries).sort();
  if (days.length) download('tagebuch.md', days.map(d => toMd(d, entries[d])).join('\n---\n\n'));
};

$('today').onclick = () => show(iso(new Date()));
$('toggle').onclick = () => setOpen(!isOpen());
$('close').onclick = () => setOpen(false);

setOpen(!mobile());
show(current);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
